<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FIND MY MECH</title>
    <link rel="icon" href="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ===== FIND MY MECH styles: black / red / silver theme from the logo ===== */
      :root {
        --bg: #09090a;
        --panel: #141416;
        --panel2: #1c1c1f;
        --line: #2e2e33;
        --ink: #f4f4f5;
        --mute: #a1a1aa;
        --red: #e5160d;
        --red2: #ff3b2f;
        --silver: #d4d4d8;
        --green: #22c55e;
        --yellow: #f5b301;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Barlow, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(900px 400px at 85% -10%, #2a0705, transparent 70%), var(--bg);
        line-height: 1.5;
      }
      h1,
      h2,
      h3 {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-style: italic;
        margin: 0 0 0.4rem;
        line-height: 1.05;
      }
      h1 {
        font-size: 2.6rem;
      }
      h2 {
        font-size: 1.7rem;
      }
      h3 {
        font-size: 1.35rem;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.25rem;
      }
      .mute {
        color: var(--silver);
        opacity: 0.7;
      }
      .right {
        margin-left: auto;
      }
      nav {
        background: #000;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
        box-shadow: 0 3px 0 var(--red);
      }
      nav .wrap {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 1.25rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        font: 800 italic 1.7rem "Barlow Condensed";
      }
      .brand img {
        height: 46px;
        width: 46px;
      }
      .brand b {
        color: var(--red2);
      }
      nav .links {
        display: flex;
        gap: 0.2rem;
        flex-wrap: wrap;
        margin-left: auto;
      }
      nav .links a {
        color: var(--silver);
        text-decoration: none;
        padding: 0.4rem 0.75rem;
        border-radius: 6px;
        font-weight: 600;
      }
      nav .links a:hover {
        background: var(--panel2);
        box-shadow: inset 0 -2px var(--red);
      }
      #burger {
        display: none;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #fff;
        font-size: 1.4rem;
        margin-left: auto;
        padding: 0.1rem 0.6rem;
      }
      @media (max-width: 820px) {
        #burger {
          display: block;
        }
        nav .wrap {
          flex-wrap: wrap;
        }
        nav .links {
          display: none;
          width: 100%;
          flex-direction: column;
          margin: 0;
        }
        nav .links.open {
          display: flex;
        }
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      }
      .two {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1.3fr 1fr;
      }
      @media (max-width: 800px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: linear-gradient(180deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.1rem;
      }
      .shop {
        border-top: 4px solid var(--line);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
      }
      .shop.green {
        border-top-color: var(--green);
      }
      .shop.yellow {
        border-top-color: var(--yellow);
      }
      .shop.red {
        border-top-color: var(--red);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.12rem 0.65rem;
        border-radius: 99px;
        font-weight: 700;
        font-size: 0.82rem;
        background: #3f3f46;
        font-style: italic;
      }
      .badge:before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.green,
      .badge.Completed,
      .badge.Confirmed {
        background: #0f5f2f;
        color: #86efac;
      }
      .badge.yellow,
      .badge.Pending,
      .badge.Waiting {
        background: #5c4300;
        color: #fcd34d;
      }
      .badge.red,
      .badge.Cancelled {
        background: #6e0b07;
        color: #ff9b94;
      }
      .badge.Called,
      .badge.InService {
        background: #7a2b00;
        color: #ffb27a;
      }
      .stats {
        display: flex;
        gap: 1.3rem;
        margin: 0.7rem 0 0.4rem;
      }
      .stats div {
        font-size: 0.8rem;
        color: var(--mute);
      }
      .stats strong {
        display: block;
        font: 800 italic 1.6rem "Barlow Condensed";
        color: #fff;
      }
      .qbar {
        display: flex;
        gap: 3px;
        margin: 0.3rem 0 0.6rem;
      }
      .qbar i {
        flex: 1;
        height: 7px;
        border-radius: 2px;
        background: #2b2b30;
        transform: skewX(-20deg);
      }
      .qbar.green i.on {
        background: var(--green);
      }
      .qbar.yellow i.on {
        background: var(--yellow);
      }
      .qbar.red i.on {
        background: var(--red);
      }
      .btn {
        display: inline-block;
        border: 1px solid #3a3a40;
        cursor: pointer;
        background: var(--panel2);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font:
          700 italic 0.95rem Barlow,
          sans-serif;
        text-decoration: none;
      }
      .btn:hover {
        border-color: var(--silver);
      }
      .btn.go {
        background: linear-gradient(180deg, var(--red2), var(--red));
        border-color: #ff6a5f;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.sm {
        padding: 0.25rem 0.65rem;
        font-size: 0.82rem;
      }
      .btn.danger {
        background: #6e0b07;
        border-color: #a3150e;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin: 0.75rem 0 0.2rem;
        color: var(--silver);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #0d0d0f;
        color: var(--ink);
        color-scheme: dark;
      }
      input:focus,
      select:focus,
      textarea:focus,
      .btn:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--red2);
        outline-offset: 1px;
      }
      .flash {
        padding: 0.65rem 0.9rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        background: #0f3a20;
        border: 1px solid #166534;
      }
      .flash.error {
        background: #4a0e0b;
        border-color: #a3150e;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.55rem;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        color: var(--mute);
        font-weight: 600;
      }
      .scroll {
        overflow-x: auto;
      }
      .price {
        font: 800 italic 1.9rem "Barlow Condensed";
        color: var(--red2);
      }
      .est {
        background: #1f0d0b;
        border: 1px dashed var(--red);
        padding: 0.7rem 0.9rem;
        border-radius: 8px;
        margin-top: 0.9rem;
      }
      .est strong {
        font: 800 italic 1.5rem "Barlow Condensed";
        color: var(--red2);
      }
      .map {
        position: relative;
        min-height: 340px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background:
          repeating-linear-gradient(0deg, #1d1d21 0 1px, transparent 1px 40px),
          repeating-linear-gradient(90deg, #1d1d21 0 1px, transparent 1px 40px), #0d0d0f;
      }
      .pin {
        position: absolute;
        transform: translate(-50%, -100%);
        font-size: 0.78rem;
        font-weight: 700;
        padding: 0.15rem 0.6rem;
        border-radius: 99px;
        white-space: nowrap;
        text-decoration: none;
        border: 2px solid #fff;
      }
      .pin.green {
        background: #15803d;
      }
      .pin.yellow {
        background: #a16207;
      }
      .pin.red {
        background: var(--red);
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        background: radial-gradient(500px 400px at 50% 40%, #3a0906, transparent 70%);
      }
      .hero img {
        width: min(380px, 80%);
      }
      .hero p {
        color: var(--silver);
        font-size: 1.15rem;
        max-width: 30ch;
      }
      .form {
        padding: 2.5rem;
        max-width: 480px;
        margin: auto;
        width: 100%;
      }
      @media (max-width: 800px) {
        .auth {
          grid-template-columns: 1fr;
        }
        .hero img {
          width: 220px;
        }
      }
      .hdr {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 1rem;
      }
      .hdr:after {
        content: "";
        flex: 1;
        height: 3px;
        background: repeating-linear-gradient(-60deg, var(--red) 0 8px, transparent 8px 14px);
      }
    </style>
  </head>
  <body>
    <!-- All screens are rendered into this div by the script below -->
    <div id="app"></div>

    <script>
      const KEY = "fmm_v1",
        ACT = ["Waiting", "Called", "In Service"],
        QS = ["Waiting", "Called", "In Service", "Completed", "Cancelled"],
        RS = ["Pending", "Confirmed", "In Service", "Completed", "Cancelled"],
        SS = ["AVAILABLE", "MODERATE", "BUSY"],
        USER = [9.6477, 123.8554];

      // ============================================================
      // CONSTANTS & SAMPLE DATA (models, prices, shops, services)
      // ============================================================
      const MODELS = {
        Honda: ["Click 125i", "Click 160", "Beat", "Wave"],
        Yamaha: ["Mio i125", "NMAX", "Aerox"],
        Suzuki: ["Raider"],
        Kawasaki: ["Barako"],
        Rusi: ["Other"],
        Motorstar: ["Other"],
        Other: ["Other"],
      };
      const MT = {
        "Click 125i": "Scooter",
        "Click 160": "Scooter",
        Beat: "Scooter",
        Wave: "Underbone",
        "Mio i125": "Scooter",
        NMAX: "Maxi-scooter",
        Aerox: "Maxi-scooter",
        Raider: "Underbone",
        Barako: "Standard",
        Other: "Standard",
      };
      const TM = { Scooter: 1, Underbone: 1, "Maxi-scooter": 1.4, Standard: 1.1, Sport: 1.5, "Big bike": 2 },
        BM = { Honda: 1, Yamaha: 1.05, Suzuki: 1.05, Kawasaki: 1.15, Rusi: 0.9, Motorstar: 0.9, Other: 1 },
        MM = { "Click 160": 1.1, NMAX: 1.15, Aerox: 1.15 };
      const SV = [
        ["Change Oil", 150, 15],
        ["Tire Change", 200, 30],
        ["Tire Repair", 100, 20],
        ["Brake Adjustment", 150, 20],
        ["Brake Pad Replacement", 300, 30],
        ["Spark Plug Replacement", 150, 15],
        ["Chain Adjustment", 100, 15],
        ["Battery Check", 100, 15],
        ["Engine Tune-Up", 500, 60],
        ["General Check-Up", 300, 30],
      ];
      const SH = [
        [
          "CDLM Motor Shop",
          "Carlos P. Garcia Ave, Tagbilaran City",
          "0917-100-0001",
          9.651,
          123.852,
          "08:00",
          "18:00",
          "AVAILABLE",
          3,
          4.6,
          1,
        ],
        [
          "ANMAR Motor Shop",
          "J.A. Clarin St, Tagbilaran City",
          "0917-100-0002",
          9.656,
          123.86,
          "08:00",
          "17:30",
          "MODERATE",
          2,
          4.3,
          3,
        ],
        [
          "AGRT Motor Shop",
          "Dampas District, Tagbilaran City",
          "0917-100-0003",
          9.67,
          123.848,
          "07:30",
          "18:00",
          "BUSY",
          2,
          4.1,
          7,
        ],
        [
          "PUG Motor Shop",
          "Cogon District, Tagbilaran City",
          "0917-100-0004",
          9.639,
          123.865,
          "09:00",
          "19:00",
          "AVAILABLE",
          2,
          4.8,
          0,
        ],
      ];

      // ============================================================
      // DATABASE: seed data + localStorage state (demo only)
      // ============================================================
      function seed() {
        const s = {
          n: 100,
          uid: null,
          users: [
            {
              id: 1,
              name: "Demo Rider",
              email: "demo@findmymech.test",
              pw: "demo123",
              phone: "09171234567",
              role: "user",
            },
          ],
          shops: [],
          services: [],
          queues: [],
          res: [],
        };
        SH.forEach((h, i) => {
          const id = i + 1;
          s.shops.push({
            id,
            name: h[0],
            addr: h[1],
            phone: h[2],
            lat: h[3],
            lng: h[4],
            open: h[5],
            close: h[6],
            status: h[7],
            mech: h[8],
            rating: h[9],
            mpc: 10,
            override: null,
          });
          SV.forEach((v, n) =>
            s.services.push({
              id: id * 100 + n,
              shop: id,
              name: v[0],
              price: v[1] + (id % 2) * 10 * (n % 3),
              dur: v[2],
            }),
          );
          s.users.push({
            id: 10 + id,
            name: h[0] + " Owner",
            email: `owner${id}@findmymech.test`,
            pw: "admin123",
            phone: h[2],
            role: "admin",
            shop: id,
          });
          for (let k = 0; k < h[10]; k++)
            s.queues.push({
              id: s.n++,
              user: 0,
              cust: "Walk-in",
              shop: id,
              svc: id * 100,
              brand: "Honda",
              model: "Beat",
              type: "Scooter",
              no: `Q-${String(k + 1).padStart(3, "0")}`,
              st: "Waiting",
              at: Date.now(),
            });
        });
        return s;
      }
      let S = JSON.parse(localStorage.getItem(KEY) || "null") || seed(),
        MSG = null;
      const save = () => localStorage.setItem(KEY, JSON.stringify(S)),
        $ = (s) => document.querySelector(s),
        cur = () => S.users.find((u) => u.id === S.uid),
        esc = (t) =>
          String(t ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );

      // ============================================================
      // HELPERS: formatting, price estimate, distance, shop status
      // ============================================================
      const fw = (m) =>
          m <= 0
            ? "No waiting"
            : m < 60
              ? m + " min"
              : Math.floor(m / 60) + " hr" + (m % 60 ? " " + (m % 60) + " min" : ""),
        cls = (s) => s.replace(" ", ""),
        shop = (id) => S.shops.find((s) => s.id == id),
        svc = (id) => S.services.find((s) => s.id == id);
      const est = (b, br, m, t) => Math.round((b * (TM[t] || 1) * (BM[br] || 1) * (MM[m] || 1)) / 5) * 5,
        fd = (e) => Object.fromEntries(new FormData(e.target)),
        flash = (t, c = "ok") => {
          MSG = { t, c };
          render();
        },
        go = (p) => {
          location.hash = "#" + p;
        };
      function dist(s) {
        const r = Math.PI / 180,
          a =
            0.5 -
            Math.cos((s.lat - USER[0]) * r) / 2 +
            (Math.cos(USER[0] * r) * Math.cos(s.lat * r) * (1 - Math.cos((s.lng - USER[1]) * r))) / 2;
        return +(12742 * Math.asin(Math.sqrt(a))).toFixed(1);
      }
      function info(s) {
        const w = S.queues.filter((q) => q.shop == s.id && ACT.includes(q.st)).length,
          m = s.override != null ? s.override : w * s.mpc,
          c = { AVAILABLE: "green", MODERATE: "yellow", BUSY: "red" }[s.status];
        return { ...s, w, m, wt: fw(m), c, label: s.status[0] + s.status.slice(1).toLowerCase(), d: dist(s) };
      }
      const shops = (q = "") =>
        S.shops
          .filter((s) => (s.name + s.addr).toLowerCase().includes(q.toLowerCase()))
          .map(info)
          .sort((a, b) => SS.indexOf(a.status) - SS.indexOf(b.status) || a.m - b.m || a.d - b.d);

      // ============================================================
      // UI PIECES: shop card + motorcycle form
      // ============================================================
      const card = (s) =>
        /* HTML */ `<article class="card shop ${s.c}">
          <div class="row">
            <h3>${s.name}</h3>
            <span class="badge ${s.c} right">${s.label}</span>
          </div>
          <div class="mute">📍 ${s.addr} · ${s.d} km away</div>
          <div class="qbar ${s.c}">
            ${[...Array(8)].map((_, i) => /* HTML */ `<i class="${i < s.w ? "on" : ""}"></i>`).join("")}
          </div>
          <div class="stats">
            <div><strong>${s.w}</strong>waiting</div>
            <div><strong>${s.wt}</strong>est. wait</div>
            <div><strong>★ ${s.rating}</strong>rating</div>
          </div>
          <div class="mute">🕗 Open ${s.open} - ${s.close}</div>
          <div class="row" style="margin-top:.8rem">
            <a class="btn ghost" href="#/shop/${s.id}">View Shop</a
            ><a class="btn go" href="#/join/${s.id}">Join Queue</a
            ><a class="btn" href="#/reserve/${s.id}">Reserve</a>
          </div>
        </article>`;
      const opts = (a, sel) =>
          a.map((x) => /* HTML */ `<option ${x == sel ? "selected" : ""}>${x}</option>`).join(""),
        pr = (n) => "₱" + Math.round(n);
      const moto = (sid, pick) =>
        /* HTML */ `<label>Service</label
          ><select name="svc">
            ${S.services
              .filter((v) => v.shop == sid)
              .map(
                (v) =>
                  /* HTML */ `<option value="${v.id}" ${v.id == pick ? "selected" : ""}>
                    ${v.name} - from ${pr(v.price)}
                  </option>`,
              )
              .join("")}
          </select>
          <div class="row" style="flex-wrap:nowrap">
            <div style="flex:1">
              <label>Brand</label
              ><select name="brand">
                ${opts(Object.keys(MODELS))}
              </select>
            </div>
            <div style="flex:1">
              <label>Model</label
              ><select name="model"></select>
            </div>
          </div>
          <label>Motorcycle type</label
          ><select name="type">
            ${opts(Object.keys(TM))}
          </select>
          <div class="est">Pick a service to see the estimated cost.</div>`;
      function bindMoto(f) {
        const g = (n) => f.elements[n],
          out = f.querySelector(".est"),
          up = () => {
            const v = svc(g("svc").value);
            if (v)
              out.innerHTML = `Estimated cost: <strong>${pr(est(v.price, g("brand").value, g("model").value, g("type").value))}</strong> <span class="mute">(starting price ${pr(v.price)}; final cost depends on parts, labor and repair complexity)</span>`;
          },
          fill = () => {
            g("model").innerHTML = opts(MODELS[g("brand").value]);
            ty();
          },
          ty = () => {
            g("type").value = MT[g("model").value] || "Standard";
            up();
          };
        g("brand").onchange = fill;
        g("model").onchange = ty;
        g("type").onchange = up;
        g("svc").onchange = up;
        fill();
      }

      // ============================================================
      // PAGES: one function per screen
      // ============================================================
      const page = {
        login: () =>
          /* HTML */ `<div class="auth">
            <section class="hero">
              <img src="${LOGO}" alt="FIND MY MECH" />
              <p>See which motorcycle shops are least busy, then queue or reserve before you ride over.</p>
            </section>
            <section class="form">
              <h2>Log in</h2>
              ${msg()}
              <form onsubmit="A.login(event)">
                <label>Email or username</label><input name="identity" required autofocus /><label
                  >Password</label
                ><input type="password" name="password" required />
                <p><button class="btn go" style="width:100%">Log in</button></p>
              </form>
              <p>
                <a
                  href="#/forgot"
                  onclick="flash('Password reset is not available in the prototype.');return false"
                  >Forgot password?</a
                >
                · <a href="#/register">Create account</a>
              </p>
              <p class="mute">
                Demo: demo@findmymech.test / demo123<br />Shop owner: owner1@findmymech.test / admin123<br /><a
                  href="#/login"
                  onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);S=seed();render()}return false"
                  >Reset demo data</a
                >
              </p>
            </section>
          </div>`,
        register: () =>
          /* HTML */ `<div class="auth">
            <section class="hero">
              <img src="${LOGO}" alt="FIND MY MECH" />
              <p>Skip the wait.</p>
            </section>
            <section class="form">
              <h2>Create account</h2>
              ${msg()}

      // ============================================================
      // ROUTER & NAVIGATION
      // ============================================================
      function msg() {
        const m = MSG;
        MSG = null;
        return m ? /* HTML */ `<div class="flash ${m.c}">${esc(m.t)}</div>` : "";
      }
      function fillShops() {
        const l = shops($("#q")?.value || ""),
          la = l.map((s) => s.lat),
          lo = l.map((s) => s.lng),
          r = (v, a, b) => 10 + (80 * (v - a)) / (b - a || 1);
        $("#list").innerHTML = l.map(card).join("") || /* HTML */ `<p>No shops match.</p>`;
        $("#map").innerHTML = l
          .map(
            (s) =>
              /* HTML */ `<a
                class="pin ${s.c}"
                style="left:${r(s.lng, Math.min(...lo), Math.max(...lo))}%;top:${100 - r(s.lat, Math.min(...la), Math.max(...la))}%"
                href="#/shop/${s.id}"
                >${s.name}</a
              >`,
          )
          .join("");
      }
      const NAV = [
        ["Home", "/home"],
        ["Find Shops", "/shops"],
        ["My Queue", "/my"],
        ["Reservations", "/my"],
        ["Services", "/services"],
        ["Profile", "/profile"],
      ];
      function nav(u) {
        return /* HTML */ `<nav>
          <div class="wrap">
            <a class="brand" href="#/${u.role == "admin" ? "admin" : "home"}"
              ><img src="${LOGO}" alt="" />FIND MY <b>MECH</b></a
            ><button id="burger" onclick="document.querySelector('.links').classList.toggle('open')">
              ☰
            </button>
            <div class="links">
              ${(u.role == "admin" ? [["Shop dashboard", "/admin"]] : NAV).map((n) => /* HTML */ `<a href="#${n[1]}">${n[0]}</a>`).join("")}<a
                href="#/login"
                onclick="A.out()"
                >Logout</a
              >
            </div>
          </div>
        </nav>`;
      }
      function render() {
        const [p, a, b] = (location.hash.slice(2) || "login").split("?")[0].split("/"),
          u = cur(),
          open = ["login", "register"].includes(p);
        let h;
        if (!u && !open) {
          go("/login");
          return;
        }
        if (u && open) {
          go(u.role == "admin" ? "/admin" : "/home");
          return;
        }
        if (p == "admin" && u?.role != "admin") {
          go("/home");
          return;
        }
        const pg = page[p] || page.home;
        try {
          h = pg(+a || undefined, +b || undefined);
        } catch (e) {
          h = /* HTML */ `<p>Not found. <a href="#/home">Home</a></p>`;
        }
        $("#app").innerHTML = open
          ? h
          : nav(u) +
            /* HTML */ `<main class="wrap">
              ${p == "login" || p == "register" ? "" : ["join", "reserve", "my", "profile", "admin"].includes(p) ? "" : msg()}${h}
            </main>`;
        if (p == "shops") fillShops();
        document.querySelectorAll("form.moto").forEach(bindMoto);
        scrollTo(0, 0);
      }

      // ============================================================
      // ACTIONS: form handlers (login, queue, reservation, admin)
      // ============================================================
      const A = {
        login(e) {
          e.preventDefault();
          const f = fd(e),
            i = f.identity.trim().toLowerCase(),
            u = S.users.find(
              (u) => (u.email.toLowerCase() == i || u.name.toLowerCase() == i) && u.pw == f.password,
            );
          if (!u) return flash("Wrong email/username or password.", "error");
          S.uid = u.id;
          save();
          go(u.role == "admin" ? "/admin" : "/home");
        },
        register(e) {
          e.preventDefault();
          const f = fd(e),
            em = f.email.trim().toLowerCase();
          if (S.users.some((u) => u.email.toLowerCase() == em))
            return flash("That email is already registered.", "error");
          S.users.push({ id: S.n++, name: f.name.trim(), email: em, pw: f.pw, phone: f.phone, role: "user" });
          save();
          MSG = { t: "Account created. Log in to continue.", c: "ok" };
          go("/login");
        },
        out() {
          S.uid = null;
          save();
        },
        join(e, id) {
          e.preventDefault();
          const f = fd(e),
            u = cur();
          if (S.queues.some((q) => q.user == u.id && q.shop == id && ACT.includes(q.st)))
            return flash("You already have an active queue at this shop. Cancel it first.", "error");
          const n = S.queues.filter((q) => q.shop == id).length + 1;
          S.queues.push({
            id: S.n++,
            user: u.id,
            cust: u.name,
            shop: id,
            svc: +f.svc,
            brand: f.brand,
            model: f.model,
            type: f.type,
            no: `Q-${String(n).padStart(3, "0")}`,
            st: "Waiting",
            at: Date.now(),
          });
          save();
          MSG = { t: "You joined the queue.", c: "ok" };
          go("/my");
        },
        cq(id) {
          const q = S.queues.find((x) => x.id == id);
          if (q && ["Waiting", "Called"].includes(q.st)) q.st = "Cancelled";
          save();
          flash("Queue cancelled.");
        },
        reserve(e, id) {
          e.preventDefault();
          const f = fd(e),
            s = shop(id);
          if (f.date < new Date().toISOString().slice(0, 10))
            return flash("Pick today or a later date.", "error");
          if (f.time < s.open || f.time > s.close)
            return flash(`Pick a time between ${s.open} and ${s.close}.`, "error");
          const rid = S.n++;
          S.res.push({
            id: rid,
            user: cur().id,
            cust: f.name,
            phone: f.phone,
            shop: id,
            svc: +f.svc,
            brand: f.brand,
            model: f.model,
            type: f.type,
            date: f.date,
            time: f.time,
            concern: f.concern,
            st: "Pending",
            no: `RES-${String(S.res.length + 1).padStart(4, "0")}`,
          });
          save();
          go("/confirm/" + rid);
        },
        cr(id) {
          const r = S.res.find((x) => x.id == id);
          if (r && ["Pending", "Confirmed"].includes(r.st)) r.st = "Cancelled";
          save();
          flash("Reservation cancelled.");
        },
        profile(e) {
          e.preventDefault();
          const f = fd(e),
            u = cur();
          u.name = f.name.trim() || u.name;
          u.phone = f.phone;
          save();
          flash("Profile saved.");
        },
        shop(e) {
          e.preventDefault();
          const f = fd(e),
            s = shop(cur().shop);
          s.status = f.status;
          s.mech = +f.mech || 0;
          s.override = f.override === "" ? null : +f.override;
          save();
          flash("Shop status updated.");
        },
        sq(id, v) {
          S.queues.find((q) => q.id == id).st = v;
          save();
          render();
        },
        sr(id, v) {
          S.res.find((r) => r.id == id).st = v;
          save();
          render();
        },

              id: S.n++,
              shop: cur().shop,
              name: f.name.trim(),
              price: +f.price,
              dur: +f.dur || 30,
            });
          save();
          render();
        },
      };
      addEventListener("hashchange", render);
      addEventListener("DOMContentLoaded", () => {
        document.querySelector("link[rel=icon]").href = LOGO;
        render();
